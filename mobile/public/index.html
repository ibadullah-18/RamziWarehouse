<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- No zoom anywhere (also not when a field is tapped on iPhone); viewport-fit=cover uses the whole screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ramzi</title>

    <!-- Installable app (iPhone: Share → Add to Home Screen; Android: Install app). -->
    <!-- Name and icons come from the server, so a new logo/name set by the admin is used on install. -->
    <link rel="manifest" href="/api/branding/manifest" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/api/branding/icon/180" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f3f6fb;
      }
      html {
        /* no double-tap zoom, no font boosting */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- The service worker shows push notifications; it does not cache the app, so updates arrive at once. -->
    <script>
      // iOS Safari ignores user-scalable=no for pinch and double-tap; stop those gestures as well.
      document.addEventListener('gesturestart', function (event) { event.preventDefault(); });
      document.addEventListener('dblclick', function (event) { event.preventDefault(); }, { passive: false });

      // Android Chrome: keep the install offer for the "Tətbiqi quraşdır" button.
      window.addEventListener('beforeinstallprompt', function (event) {
        window.__grandwallInstallPrompt = event;
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Ramzi üçün JavaScript açıq olmalıdır.</noscript>
    <div id="root"></div>
  </body>
</html>
