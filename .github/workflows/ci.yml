name: GrandWall CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'ops/**'
              - 'docker-compose.production.yml'
            mobile:
              - 'mobile/**'

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - changes

    if: >
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore backend packages
        run: >
          dotnet restore
          backend/GrandWall.slnx

      - name: Build backend
        run: >
          dotnet build
          backend/GrandWall.slnx
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          backend/GrandWall.slnx
          --configuration Release
          --no-build
          --verbosity normal

      - name: Check vulnerable NuGet packages
        run: >
          dotnet list
          backend/GrandWall.slnx
          package
          --vulnerable
          --include-transitive

  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - changes

    if: >
      needs.changes.outputs.mobile == 'true' ||
      github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile packages
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Expo Doctor
        run: npx --yes expo-doctor@1.20.2

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - changes
      - backend

    if: >
      always() &&
      (
        needs.changes.outputs.backend == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      needs.backend.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production API image
        run: >
          docker build
          --file backend/Dockerfile
          --tag grandwall-api:ci
          backend

  deploy:
    name: Deploy GrandWall to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - changes
      - docker

    if: >
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.backend == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      needs.docker.result == 'success'

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/grandwall_deploy_key
          chmod 600 ~/.ssh/grandwall_deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update and deploy production server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/grandwall_deploy_key \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/administrator/RamziWarehouse

          echo "=== GrandWall deployment started ==="

          echo "Current commit:"
          git log -1 --oneline

          if ! git diff --quiet -- \
            ops/backup-database.sh \
            ops/deploy-production.sh; then

            echo "Server-local ops changes detected. Stashing..."

            git stash push \
              -m "github-actions-auto-stash" \
              -- \
              ops/backup-database.sh \
              ops/deploy-production.sh
          fi

          echo "Fetching origin/main..."
          git fetch origin main

          echo "Updating server repository..."
          git checkout main
          git merge --ff-only origin/main

          echo "New commit:"
          git log -1 --oneline

          echo "Starting production deployment..."
          bash ops/deploy-production.sh

          echo "=== GrandWall deployment completed ==="
          REMOTE

      - name: Verify production API
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://api.grandwall.az/api/app-version/android

          echo

  mobile-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs:
      - changes
      - mobile
      - deploy

    if: >
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.mobile == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      needs.mobile.result == 'success' &&
      (
        needs.deploy.result == 'success' ||
        needs.deploy.result == 'skipped'
      )

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile packages
        run: npm ci

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -Eeuo pipefail

          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

          test -s eas-build.json

      - name: Read EAS build information
        id: eas
        run: |
          node <<'NODE'
          const fs = require("fs");

          const raw = JSON.parse(
            fs.readFileSync("eas-build.json", "utf8")
          );

          const build = Array.isArray(raw) ? raw[0] : raw;

          const url =
            build.artifacts?.buildUrl ??
            build.artifacts?.applicationArchiveUrl;

          const version =
            build.appVersion ??
            build.version ??
            "1.0.0";

          const versionCode =
            build.appBuildVersion ??
            build.versionCode;

          if (!url) {
            throw new Error("APK URL tapılmadı.");
          }

          if (!versionCode) {
            throw new Error("Android versionCode tapılmadı.");
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `url=${url}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${version}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version_code=${versionCode}\n`
          );

          console.log(`Version: ${version}`);
          console.log(`VersionCode: ${versionCode}`);
          NODE

      - name: Download APK
        env:
          APK_URL: ${{ steps.eas.outputs.url }}
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output grandwall.apk \
            "$APK_URL"

          test -s grandwall.apk

          echo "Downloaded APK:"
          ls -lh grandwall.apk

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" \
            > ~/.ssh/grandwall_release_key

          chmod 600 ~/.ssh/grandwall_release_key

          ssh-keyscan -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload APK to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          scp \
            -i ~/.ssh/grandwall_release_key \
            grandwall.apk \
            "$VPS_USER@$VPS_HOST:/tmp/grandwall-new.apk"

      - name: Publish Android release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VERSION: ${{ steps.eas.outputs.version }}
          VERSION_CODE: ${{ steps.eas.outputs.version_code }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/grandwall_release_key \
            "$VPS_USER@$VPS_HOST" \
            "VERSION='$VERSION' VERSION_CODE='$VERSION_CODE' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          APK_DIRECTORY="/var/www/grandwall-downloads"
          RELEASE_DIRECTORY="/home/administrator/RamziWarehouse/releases"

          echo "=== Publishing GrandWall Android ==="
          echo "Version: ${VERSION}"
          echo "VersionCode: ${VERSION_CODE}"

          test -s /tmp/grandwall-new.apk

          sudo mkdir -p "$APK_DIRECTORY"
          mkdir -p "$RELEASE_DIRECTORY"

          sudo cp \
            /tmp/grandwall-new.apk \
            "$APK_DIRECTORY/grandwall.apk.new"

          sudo chmod 644 \
            "$APK_DIRECTORY/grandwall.apk.new"

          if [[ -f "$APK_DIRECTORY/grandwall.apk" ]]; then
            sudo cp \
              "$APK_DIRECTORY/grandwall.apk" \
              "$APK_DIRECTORY/grandwall-old.apk"
          fi

          sudo mv \
            "$APK_DIRECTORY/grandwall.apk.new" \
            "$APK_DIRECTORY/grandwall.apk"

          rm -f /tmp/grandwall-new.apk

          cat > "$RELEASE_DIRECTORY/android.json.tmp" <<JSON
          {
            "latestVersion": "${VERSION}",
            "latestVersionCode": ${VERSION_CODE},
            "minimumVersionCode": 2,
            "forceUpdate": false,
            "downloadUrl": "https://grandwall.az/?mode=update",
            "releaseNotes": [
              "GrandWall tətbiqinin yeni versiyası mövcuddur."
            ]
          }
          JSON

          mv \
            "$RELEASE_DIRECTORY/android.json.tmp" \
            "$RELEASE_DIRECTORY/android.json"

          chmod 644 \
            "$RELEASE_DIRECTORY/android.json"

          echo
          echo "APK:"
          ls -lh "$APK_DIRECTORY/grandwall.apk"

          echo
          echo "Release metadata:"
          cat "$RELEASE_DIRECTORY/android.json"

          echo
          echo "=== Android release published ==="
          REMOTE

      - name: Verify published release
        env:
          VERSION_CODE: ${{ steps.eas.outputs.version_code }}
        run: |
          set -Eeuo pipefail

          sleep 5

          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              https://api.grandwall.az/api/app-version/android
          )"

          echo "$RESPONSE"

          echo "$RESPONSE" |
            jq -e \
              --argjson code "$VERSION_CODE" \
              '.latestVersionCode == $code'

          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            https://grandwall.az/download/grandwall.apk

          echo
          echo "GrandWall Android release verified."
