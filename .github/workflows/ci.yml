name: GrandWall CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore backend packages
        run: >
          dotnet restore
          backend/GrandWall.slnx

      - name: Build backend
        run: >
          dotnet build
          backend/GrandWall.slnx
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          backend/GrandWall.slnx
          --configuration Release
          --no-build
          --verbosity normal

      - name: Check vulnerable NuGet packages
        run: >
          dotnet list
          backend/GrandWall.slnx
          package
          --vulnerable
          --include-transitive

  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile packages
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Expo Doctor
        run: npx --yes expo-doctor@1.20.2

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - backend
      - mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production API image
        run: >
          docker build
          --file backend/Dockerfile
          --tag grandwall-api:ci
          backend

  deploy:
    name: Deploy GrandWall to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - docker

    # Pull request zamanı serverə deploy ETMƏ.
    # Yalnız main branch-ə real push zamanı deploy et.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/grandwall_deploy_key
          chmod 600 ~/.ssh/grandwall_deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update and deploy production server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/grandwall_deploy_key \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/administrator/RamziWarehouse

          echo "=== GrandWall deployment started ==="

          echo "Current commit:"
          git log -1 --oneline

          # Serverdə yalnız ops fayllarında lokal dəyişiklik varsa
          # onları müvəqqəti saxla.
          if ! git diff --quiet -- \
            ops/backup-database.sh \
            ops/deploy-production.sh; then

            echo "Server-local ops changes detected. Stashing..."

            git stash push \
              -m "github-actions-auto-stash" \
              -- \
              ops/backup-database.sh \
              ops/deploy-production.sh
          fi

          echo "Fetching origin/main..."
          git fetch origin main

          echo "Updating server repository..."
          git checkout main
          git merge --ff-only origin/main

          echo "New commit:"
          git log -1 --oneline

          echo "Starting production deployment..."
          bash ops/deploy-production.sh

          echo "=== GrandWall deployment completed ==="
          REMOTE

      - name: Verify production API
        run: |
          set -e

          echo "Checking GrandWall API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://api.grandwall.az/api/app-version/android

          echo
          echo "GrandWall production API is reachable."